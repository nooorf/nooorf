<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" fill="none">
<style>@keyframes d0{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o0{animation:d0 9s ease-in-out infinite}@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}.o1{animation:d1 11s ease-in-out infinite}@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o2{animation:d2 13s ease-in-out infinite}</style>
<defs>
  <clipPath id="clip"><rect width="1000" height="440" rx="24"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="65"/></filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="440" fill="#090A14"/>
  <g filter="url(#blur)"><circle class="o0" cx="80" cy="440" r="150" fill="#0E7490" opacity="0.45"/><circle class="o1" cx="930" cy="30" r="170" fill="#6D28D9" opacity="0.4"/><circle class="o2" cx="620" cy="480" r="120" fill="#BE185D" opacity="0.22"/></g>
</g>
<rect x="0.75" y="0.75" width="998.5" height="438.5" rx="23.5" stroke="url(#edge)" stroke-width="1.5"/>
<text x="60.0" y="72.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#22D3EE" fill-opacity="0.85">ABOUT</text><text x="60.0" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Building intelligent systems at the intersection of</text><text x="60.0" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">deep learning and systems engineering.</text><text x="60.0" y="226.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">I’m a Computer Science undergraduate at NUST who designs and ships machine learning systems end-to-end:</text><text x="60.0" y="253.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">framing the problem, engineering the data, training the model and taking it to monitored production.</text><text x="60.0" y="280.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">My work spans LLM and RAG systems, MLOps, medical imaging, federated learning and deep reinforcement</text><text x="60.0" y="307.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">learning research, including a co-authored IEEE GLOBECOM 2026 workshop paper. I care about what</text><text x="60.0" y="334.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">separates demos from deployed AI: rigorous evaluation, grounded generation and models people can trust.</text><rect x="60.00" y="364" width="255.1" height="36" rx="18.0" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.35"/><circle cx="80.00" cy="382.0" r="4" fill="#22D3EE"/><text x="195.1" y="387.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.6" fill="#CBD5E1">BS Computer Science · NUST</text><rect x="325.10" y="364" width="162.9" height="36" rx="18.0" fill="#8B5CF6" fill-opacity="0.07" stroke="#8B5CF6" stroke-opacity="0.35"/><circle cx="345.10" cy="382.0" r="4" fill="#8B5CF6"/><text x="414.1" y="387.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.6" fill="#CBD5E1">CGPA 3.88 / 4.0</text><rect x="498.05" y="364" width="237.0" height="36" rx="18.0" fill="#EC4899" fill-opacity="0.07" stroke="#EC4899" stroke-opacity="0.35"/><circle cx="518.05" cy="382.0" r="4" fill="#EC4899"/><text x="624.1" y="387.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.6" fill="#CBD5E1">Dean’s List · 6/6 semesters</text><rect x="745.09" y="364" width="177.0" height="36" rx="18.0" fill="#14B8A6" fill-opacity="0.07" stroke="#14B8A6" stroke-opacity="0.35"/><circle cx="765.09" cy="382.0" r="4" fill="#14B8A6"/><text x="841.1" y="387.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.6" fill="#CBD5E1">Merit Scholar · 6/6</text><rect x="60" y="88" width="56" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
