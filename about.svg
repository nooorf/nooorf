<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none">
<style>@keyframes d0{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o0{animation:d0 9s ease-in-out infinite}@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}.o1{animation:d1 11s ease-in-out infinite}@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o2{animation:d2 13s ease-in-out infinite}</style>
<defs>
  <clipPath id="clip"><rect width="1000" height="360" rx="24"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="65"/></filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="360" fill="#090A14"/>
  <g filter="url(#blur)"><circle class="o0" cx="80" cy="360" r="150" fill="#0E7490" opacity="0.45"/><circle class="o1" cx="930" cy="30" r="170" fill="#6D28D9" opacity="0.4"/><circle class="o2" cx="620" cy="400" r="120" fill="#BE185D" opacity="0.22"/></g>
  
</g>
<rect x="0.75" y="0.75" width="998.5" height="358.5" rx="23.5" stroke="url(#edge)" stroke-width="1.5"/>
<text x="60" y="72" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#22D3EE" fill-opacity="0.85">ABOUT</text><text x="60" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Building intelligent systems at the intersection of</text><text x="60" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">deep learning and systems engineering.</text><text x="60" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">I design and ship machine learning systems end-to-end: framing the problem, engineering the data,</text><text x="60" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">architecting and training the model, and taking it to reliable, scalable production. I specialise in</text><text x="60" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">the details that separate demos from deployed AI: rigorous evaluation, calibrated uncertainty,</text><text x="60" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#94A3B8">efficient training and inference at scale, privacy by design, and models people can trust and explain.</text><rect x="60" y="88" width="56" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
