<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="628" viewBox="0 0 1000 628" fill="none">
<style>@keyframes d0{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o0{animation:d0 9s ease-in-out infinite}@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}.o1{animation:d1 11s ease-in-out infinite}@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}.o2{animation:d2 13s ease-in-out infinite}</style>
<defs>
  <clipPath id="clip"><rect width="1000" height="628" rx="24"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="65"/></filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="pub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.08"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.10"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="628" fill="#090A14"/>
  <g filter="url(#blur)"><circle class="o0" cx="120" cy="40" r="150" fill="#0E7490" opacity="0.35"/><circle class="o1" cx="900" cy="628" r="170" fill="#6D28D9" opacity="0.35"/><circle class="o2" cx="520" cy="688" r="150" fill="#BE185D" opacity="0.25"/></g>
</g>
<rect x="0.75" y="0.75" width="998.5" height="626.5" rx="23.5" stroke="url(#edge)" stroke-width="1.5"/>
<text x="60.0" y="66.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#22D3EE" fill-opacity="0.85">RESEARCH &amp; PUBLICATIONS</text><rect x="60" y="92" width="880" height="128" rx="18" fill="url(#pub)" stroke="#8B5CF6" stroke-opacity="0.35"/><text x="88.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1.5" fill="#22D3EE">IEEE GLOBECOM 2026 WORKSHOP  ·  PUBLISHED  ·  CO-AUTHOR</text><text x="88.0" y="162.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">RIS-Assisted Physical Layer Security for</text><text x="88.0" y="194.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">PASS-Enabled Backscatter NOMA Systems</text><text x="60" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Student Researcher<tspan fill="#64748B" font-weight="400">  ·  </tspan><tspan fill="#22D3EE">IPT Lab, NUST</tspan></text><text x="940.0" y="269.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1" fill="#94A3B8">MAR 2026 – AUG 2026 · ISLAMABAD</text><circle cx="66" cy="305" r="3" fill="#8B5CF6" fill-opacity="0.9"/><text x="82.0" y="310.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">Developed deep reinforcement learning methods for joint optimization</text><text x="82.0" y="332.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">of RIS-assisted PASS backscatter NOMA systems under secrecy,</text><text x="82.0" y="354.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">throughput, energy and fairness constraints.</text><circle cx="66" cy="387" r="3" fill="#8B5CF6" fill-opacity="0.9"/><text x="82.0" y="392.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">Engineered a wireless simulation pipeline modeling joint antenna</text><text x="82.0" y="414.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">positioning, power splitting and 16-element RIS phase control</text><text x="82.0" y="436.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">with 4-bit quantization.</text><circle cx="66" cy="469" r="3" fill="#8B5CF6" fill-opacity="0.9"/><text x="82.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#CBD5E1">Raised spatial feasibility from 73.2% to 98.4% across 441</text><text x="82.0" y="496.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">eavesdropper locations with RIS-assisted alternating optimization,</text><text x="82.0" y="518.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">establishing the baseline for the DRL work.</text><rect x="664" y="292" width="276" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#22D3EE" stroke-opacity="0.3"/><rect x="664" y="310" width="3" height="40" rx="1.5" fill="#22D3EE"/><text x="686.0" y="328.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">98.4%</text><text x="686.0" y="351.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">spatial feasibility, up from 73.2%</text><rect x="664" y="380" width="276" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#8B5CF6" stroke-opacity="0.3"/><rect x="664" y="398" width="3" height="40" rx="1.5" fill="#8B5CF6"/><text x="686.0" y="416.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">441</text><text x="686.0" y="439.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">eavesdropper locations evaluated</text><rect x="664" y="468" width="276" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#EC4899" stroke-opacity="0.3"/><rect x="664" y="486" width="3" height="40" rx="1.5" fill="#EC4899"/><text x="686.0" y="504.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">16 × 4-bit</text><text x="686.0" y="527.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">RIS elements, quantized phase control</text><rect x="60" y="548" width="880" height="1" fill="#FFFFFF" fill-opacity="0.08"/><text x="60" y="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8"><tspan fill="#CBD5E1" font-weight="600">Also co-authored</tspan>  “Data-driven analysis of smog patterns in Pakistan”  ·  <tspan fill="#EC4899">DAWN News</tspan></text><text x="60.0" y="600.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Research supported in part by the Pakistan Science Foundation (PSF) under the DABICSE project.</text>
</svg>
