 Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="0.4" fill="#CBD5E1">Retrieval Evaluation</text><rect x="311.4" y="184" width="129.4" height="26" rx="13" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.3"/><text x="376.2" y="201.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="0.4" fill="#CBD5E1">Conversational AI</text><rect x="448.9" y="184" width="139.6" height="26" rx="13" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.3"/><text x="518.7" y="201.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="0.4" fill="#CBD5E1">Pipeline Debugging</text><circle cx="72" cy="254" r="11" fill="#8B5CF6" fill-opacity="0.12"/><circle cx="72" cy="254" r="5" fill="#8B5CF6"/><text x="100" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Frontend Developer<tspan fill="#64748B" font-weight="400">  ·  </tspan><tspan fill="#8B5CF6">Growthrune</tspan></text><text x="940.0" y="260.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="1" fill="#94A3B8">APR 2025 – FEB 2026 · REMOTE</text><text x="100.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Led frontend and full-stack developers through code reviews and PR approvals. Built 5+ real-time features</text><text x="100.0" y="313.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">for an agentic AI platform, integrated 8+ backend endpoints and cut initial page load time by 25%.</text><rect x="100.0" y="326" width="58.6" height="26" rx="13" fill="#8B5CF6" fi